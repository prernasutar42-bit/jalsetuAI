services:
  - type: web
    name: jalsetu-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements_core.txt click email-validator 'bcrypt<4.1.0' 'uvicorn[standard]' starlette && pip install --no-deps xgboost && python -m backend.app.data.seed_zones"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app,https://*.onrender.com,https://prernasutar42-bit.github.io"
