services:
  - type: web
    name: jalsetu-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements_core.txt click email-validator 'bcrypt<4.1.0' 'uvicorn[standard]' starlette --no-deps xgboost && python -m backend.app.data.seed_zones"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app,https://*.onrender.com"

  - type: web
    name: jalsetu-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_BASE_PATH
        value: "/"
      - key: VITE_USE_MOCK
        value: "false"
